spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/user_service_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true

server:
  port: 8081
  servlet:
    context-path: /user-service

jwt:
  secret: MySecretKeyForBankSystemThatMustBeAtLeast256BitsCryptography
  expiration: 86400000  # 24 hours in milliseconds

logging:
  level:
    root: INFO
    com.banksystem: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
